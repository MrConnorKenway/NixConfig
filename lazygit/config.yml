gui:
  showBottomLine: false
  scrollHeight: 10
  lightTheme:
    activeBorderColor:
      - '#7287fd'
      - bold
    inactiveBorderColor:
      - '#6c6f85'
    optionsTextColor:
      - '#1e66f5'
    selectedLineBgColor:
      - '#ccd0da'
    cherryPickedCommitBgColor:
      - '#bcc0cc'
    cherryPickedCommitFgColor:
      - '#7287fd'
    unstagedChangesColor:
      - '#d20f39'
    defaultFgColor:
      - '#4c4f69'
    searchingActiveBorderColor:
      - '#df8e1d'
    authorColors:
      '*': '#7287fd'
  darkTheme:
    activeBorderColor:
      - '#b4befe'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#b4befe'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
    authorColors:
      '*': '#b4befe'
git:
  autoFetch: false
  diffRenderers:
    - command: "delta --{{colorScheme}} --paging=never"
os:
  editPreset: 'nvim-remote'
quitOnTopLevelReturn: true
